name: Mustapha preserved Darija timbre conversion gate
on:
  push:
    branches: [temp/mustapha-hadra-validation]
    paths: [.github/workflows/hadra-mustapha-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Prepare existing preserved source without regeneration
        env:
          ARTIFACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p voice_validation
          python - <<'PY'
          import os,urllib.request,zipfile,io,hashlib,json
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          req=urllib.request.Request("https://api.github.com/repos/india123445t-pixel/allobilalapp/actions/artifacts/11119905205/zip",headers={"Authorization":"Bearer "+os.environ["ARTIFACT_TOKEN"],"Accept":"application/vnd.github+json"})
          try:
              urllib.request.build_opener(NoRedirect).open(req)
              raise RuntimeError("Expected signed artifact redirect")
          except urllib.error.HTTPError as e:
              assert e.code==302,e.code
              url=e.headers["Location"]
          raw=urllib.request.urlopen(url).read()
          assert hashlib.sha256(raw).hexdigest()=="e67743a0a94e5d5ba6b21f7a4cd63d582d90448ad1ad29630d4d473244ff30d3"
          z=zipfile.ZipFile(io.BytesIO(raw))
          open("/tmp/mustapha_source.wav","wb").write(z.read("mustapha_lahgtna_lively.wav"))
          urllib.request.urlretrieve("https://resource2.heygen.ai/audio/7fa5e8f14fd9486c98bab83932f35bca/original.wav","/tmp/mustapha_original.wav")
          json.dump({"source_artifact":11119905205,"source_sha256":hashlib.sha256(z.read("mustapha_lahgtna_lively.wav")).hexdigest(),"source_regenerated":False,"code_commit":"51383efd921027683c89e5348211d93ff12ac2a8","convert_style":False,"accepted_by_user":False},open("voice_validation/validation.json","w"),indent=2)
          PY
      - name: Install bounded isolated CPU conversion runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install torch==2.4.0 torchaudio==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy==1.13.1 librosa==0.10.2 transformers==4.46.3 huggingface-hub==0.28.1 munch==4.0.0 einops==0.8.0 hydra-core==1.3.2 pyyaml soundfile==0.12.1 pydub==0.25.1 accelerate safetensors
          git clone https://github.com/Plachtaa/seed-vc.git /tmp/seed-vc
          git -C /tmp/seed-vc checkout 51383efd921027683c89e5348211d93ff12ac2a8
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/seed-vc/inference_v2.py");s=p.read_text()
          assert s.count("dtype = torch.float16")==1
          s=s.replace("dtype = torch.float16","dtype = torch.float16 if device.type == 'cuda' else torch.float32")
          compile(s,str(p),"exec");p.write_text(s)
          PY
          ffmpeg -y -ss 1.4 -i /tmp/mustapha_original.wav -t 8 -ar 22050 -ac 1 /tmp/mustapha_target.wav
      - name: One timbre-only conversion preserving source speaking style
        run: |
          cd /tmp/seed-vc
          set -o pipefail
          timeout 600 python -u inference_v2.py --source /tmp/mustapha_source.wav --target /tmp/mustapha_target.wav --output "$GITHUB_WORKSPACE/voice_validation/converted" --diffusion-steps 25 --length-adjust 1.0 --convert-style false --anonymization-only false --intelligibility-cfg-rate 0.7 --similarity-cfg-rate 0.7 2>&1 | tee "$GITHUB_WORKSPACE/voice_validation/conversion.log"
          python - <<'PY'
          import os,json,pathlib,soundfile as sf,numpy as np
          p=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"voice_validation"
          files=list((p/"converted").glob("*.wav"));assert len(files)==1,files
          audio,sr=sf.read(files[0]);seconds=len(audio)/sr
          assert 2<seconds<12 and np.isfinite(audio).all() and np.sqrt(np.mean(audio**2))>0.0001
          sf.write(p/"mustapha_timbre_conversion.wav",audio,sr,subtype="PCM_16")
          v=json.loads((p/"validation.json").read_text());v["output"]={"seconds":seconds,"rate":sr,"rms":float(np.sqrt(np.mean(audio**2))),"peak":float(np.max(np.abs(audio)))}
          (p/"validation.json").write_text(json.dumps(v,indent=2));print("CONVERSION_READY",v)
          PY
      - name: Preserve output and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mustapha-timbre-conversion-gate
          path: voice_validation/
          retention-days: 3
          if-no-files-found: warn
