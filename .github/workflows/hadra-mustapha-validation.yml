name: HADRA Mustapha voice validation
on:
  push:
    branches: [temp/mustapha-hadra-validation]
    paths: [.github/workflows/hadra-mustapha-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated CPU validation runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install habibi-tts transformers==4.49.0 soundfile
      - name: Validate NEW Darija sentence using existing Mustapha reference
        run: |
          cat > /tmp/validate_voice.py <<'PY'
          import os, json, time, gc, urllib.request, subprocess
          from pathlib import Path
          import torch, torchaudio, soundfile as sf
          from huggingface_hub import hf_hub_download
          from transformers import pipeline
          torch.set_num_threads(2)
          OUT=Path("voice_validation"); OUT.mkdir(exist_ok=True)
          urllib.request.urlretrieve("https://resource2.heygen.ai/audio/7fa5e8f14fd9486c98bab83932f35bca/original.wav", "/tmp/mustapha_raw.wav")
          subprocess.run(["ffmpeg","-y","-i","/tmp/mustapha_raw.wav","-ac","1","-ar","24000","-t","8","/tmp/mustapha_ref.wav"],check=True)
          audio,sr=sf.read("/tmp/mustapha_ref.wav")
          assert len(audio)>sr*2, "Reference too short"
          print("REFERENCE_SECONDS",len(audio)/sr,flush=True)
          asr=pipeline("automatic-speech-recognition", model="openai/whisper-base", device=-1)
          ref_text=asr("/tmp/mustapha_ref.wav",generate_kwargs={"language":"ar","task":"transcribe"})["text"].strip()
          print("REFERENCE_TRANSCRIPT",ref_text,flush=True)
          assert len(ref_text)>8, "Reference transcript empty or too short"
          del asr; gc.collect()
          from f5_tts.infer.utils_infer import load_model, load_vocoder
          from f5_tts.model import DiT
          from habibi_tts.infer.utils_infer import infer_process
          repo="Jip7e/habibi-tts-doda-darija"
          ckpt=hf_hub_download(repo, "model_ema.safetensors")
          vocab=hf_hub_download(repo, "vocab.txt")
          cfg=dict(dim=1024,depth=22,heads=16,ff_mult=2,text_dim=512,conv_layers=4)
          model=load_model(DiT,cfg,ckpt,vocab_file=vocab,device="cpu")
          vocoder=load_vocoder("vocos",device="cpu")
          target="واش نخرجو نشربو شي أتاي؟ من بعد نرجعو ونكملو الخدمة بشوية."
          started=time.time()
          with torch.inference_mode():
              wav,rate,_=infer_process("/tmp/mustapha_ref.wav",ref_text,target,model,vocoder,nfe_step=32,cfg_strength=2.0,sway_sampling_coef=-1.0,speed=0.95,device="cpu")
          assert len(wav)>rate, "Output too short"
          sf.write(OUT/"mustapha_hadra_new_sentence.wav",wav,rate)
          meta={"model":repo,"reference_transcript_automatic_needs_verification":ref_text,"new_sentence":target,"rate":rate,"seconds":len(wav)/rate,"inference_seconds":time.time()-started,"accepted_by_user":False}
          (OUT/"validation.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps(meta,ensure_ascii=False),flush=True)
          del model,vocoder;gc.collect()
          asr=pipeline("automatic-speech-recognition",model="openai/whisper-base",device=-1)
          meta["output_transcript_advisory_only"]=asr(str(OUT/"mustapha_hadra_new_sentence.wav"),generate_kwargs={"language":"ar","task":"transcribe"})["text"]
          (OUT/"validation.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print("OUTPUT_TRANSCRIPT",meta["output_transcript_advisory_only"],flush=True)
          
          PY
          python -u /tmp/validate_voice.py
      - name: Preserve audio and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mustapha-hadra-validation
          path: voice_validation/
          retention-days: 3
          if-no-files-found: warn
