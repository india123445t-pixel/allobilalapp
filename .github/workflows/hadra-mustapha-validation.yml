name: Mustapha S2 expressive identity controlled gate
on:
  push:
    branches: [temp/mustapha-hadra-validation]
    paths: [.github/workflows/hadra-mustapha-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned native CPU runtime
        run: |
          mkdir -p voice_validation
          free -m
          git clone --recurse-submodules https://github.com/rodrigomatta/s2.cpp.git /tmp/s2
          git -C /tmp/s2 checkout 2c33261938da1a41d713768b1b391b4d368d7d2c
          git -C /tmp/s2 submodule update --init --recursive
          cmake -S /tmp/s2 -B /tmp/s2/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/s2/build --parallel 4
          /tmp/s2/build/s2 --help
      - name: Prepare pinned weights and existing own reference
        run: |
          python3 - <<'PY'
          import urllib.request,json,pathlib,hashlib,wave,struct
          out=pathlib.Path("voice_validation")
          repo="rodrigomt/s2-pro-gguf"
          info=json.load(urllib.request.urlopen("https://huggingface.co/api/models/"+repo))
          rev=info["sha"]
          versions=dict(model=repo,revision=rev,code_commit="2c33261938da1a41d713768b1b391b4d368d7d2c",accepted_by_user=False)
          out.joinpath("validation.json").write_text(json.dumps(versions,indent=2))
          for name in ["s2-pro-q6_k.gguf","tokenizer.json"]:
              urllib.request.urlretrieve("https://huggingface.co/"+repo+"/resolve/"+rev+"/"+name,"/tmp/"+name)
              h=hashlib.sha256()
              with open("/tmp/"+name,"rb") as f:
                  for b in iter(lambda:f.read(1048576),b""):h.update(b)
              versions[name]=dict(bytes=pathlib.Path("/tmp/"+name).stat().st_size,sha256=h.hexdigest())
              out.joinpath("validation.json").write_text(json.dumps(versions,indent=2))
          urllib.request.urlretrieve("https://resource2.heygen.ai/audio/7fa5e8f14fd9486c98bab83932f35bca/original.wav","/tmp/mustapha_original.wav")
          with wave.open("/tmp/mustapha_original.wav","rb") as w:
              rate=w.getframerate();channels=w.getnchannels()
              assert w.getsampwidth()==2 and channels==2
              w.setpos(round(rate*1.4));raw=w.readframes(round(rate*5.4))
          samples=struct.unpack("<"+"h"*(len(raw)//2),raw)
          mono=[round((samples[i]+samples[i+1])/2) for i in range(0,len(samples),2)]
          with wave.open("/tmp/mustapha_ref.wav","wb") as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(rate)
              w.writeframes(struct.pack("<"+"h"*len(mono),*mono))
          versions["reference"]=dict(source="existing own recording",start_seconds=1.4,duration_seconds=5.4,transcript="السلام خويا، كيداير؟ لاباس عليك؟ أنا مصطفى، والحمد لله كلشي مزيان.")
          versions["text"]="[excited] إيوا مصطفى، اليوم عندنا خبر زوين! [chuckle] ضحكتيني آ خويا. [sad] ولكن هاد الخبر الآخر حزني. [sigh] خليني ناخد نفس ونكمل."
          out.joinpath("validation.json").write_text(json.dumps(versions,ensure_ascii=False,indent=2))
          PY
      - name: One controlled Darija voice clone with real inline performance cues
        run: |
          set -o pipefail
          timeout 900 /tmp/s2/build/s2 --model /tmp/s2-pro-q6_k.gguf --tokenizer /tmp/tokenizer.json --prompt-audio /tmp/mustapha_ref.wav --prompt-text "السلام خويا، كيداير؟ لاباس عليك؟ أنا مصطفى، والحمد لله كلشي مزيان." --text "[excited] إيوا مصطفى، اليوم عندنا خبر زوين! [chuckle] ضحكتيني آ خويا. [sad] ولكن هاد الخبر الآخر حزني. [sigh] خليني ناخد نفس ونكمل." --threads 4 --max-tokens 512 --temperature 0.7 --top-p 0.7 --codec-cpu --output voice_validation/mustapha_s2_expressive.wav 2>&1 | tee voice_validation/inference.log
          python3 - <<'PY'
          import wave,json,pathlib,struct,math
          p=pathlib.Path("voice_validation")
          with wave.open(str(p/"mustapha_s2_expressive.wav")) as w:
              info=dict(rate=w.getframerate(),channels=w.getnchannels(),width=w.getsampwidth(),frames=w.getnframes())
              info["seconds"]=info["frames"]/info["rate"]
              assert 1<info["seconds"]<40,info
          v=json.loads((p/"validation.json").read_text());v["output"]=info
          (p/"validation.json").write_text(json.dumps(v,ensure_ascii=False,indent=2))
          print("AUDIO_READY",info)
          PY
      - name: Preserve evidence and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mustapha-s2-expressive-gate
          path: voice_validation/
          retention-days: 3
          if-no-files-found: warn
