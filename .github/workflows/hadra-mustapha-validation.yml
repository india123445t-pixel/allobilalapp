name: HADRA Mustapha voice validation
on:
  push:
    branches: [temp/mustapha-hadra-validation]
    paths: [.github/workflows/hadra-mustapha-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated CPU validation runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install habibi-tts transformers==4.49.0 soundfile
      - name: Validate NEW Darija sentence using existing Mustapha reference
        run: |
          cat > /tmp/validate_voice.py <<'PY'
          import os, json, time, gc, urllib.request, subprocess
          from pathlib import Path
          import torch, torchaudio, soundfile as sf
          from huggingface_hub import hf_hub_download
          from transformers import pipeline
          torch.set_num_threads(2)
          OUT=Path("voice_validation"); OUT.mkdir(exist_ok=True)
          urllib.request.urlretrieve("https://resource2.heygen.ai/audio/7fa5e8f14fd9486c98bab83932f35bca/original.wav", "/tmp/mustapha_raw.wav")
          subprocess.run(["ffmpeg","-y","-i","/tmp/mustapha_raw.wav","-ac","1","-ar","24000","-t","8","/tmp/mustapha_ref.wav"],check=True)
          audio,sr=sf.read("/tmp/mustapha_ref.wav")
          assert len(audio)>sr*2, "Reference too short"
          audio=audio/max(abs(audio).max(),0.001)*0.90
          sf.write("/tmp/mustapha_ref.wav",audio,sr)
          print("REFERENCE_SECONDS",len(audio)/sr,flush=True)
          asr=pipeline("automatic-speech-recognition", model="openai/whisper-large-v3-turbo", device=-1)
          alignment=asr("/tmp/mustapha_ref.wav",return_timestamps="word",generate_kwargs={"language":"ar","task":"transcribe"})
          ref_text=alignment["text"].strip()
          chunks=alignment.get("chunks",[])
          boundaries=[x["timestamp"][1] for x in chunks if "عليك" in x["text"] and x["timestamp"][1] is not None]
          assert boundaries, "Cannot align existing question: preserve baseline and inspect alignment"
          split=float(boundaries[0])
          assert 2.0 < split < 6.0, f"Unusable question boundary: {split}"
          refs=[]
          for label,start,end,target,seconds in [
              ("question",0.0,split,"واش نخرجو نشربو شي أتاي؟",3.7),
              ("statement",split,8.0,"من بعد نرجعو ونكملو الخدمة بشوية.",4.4)]:
              clip=audio[int(start*sr):int(end*sr)]
              path=f"/tmp/mustapha_{label}.wav"
              sf.write(path,clip,sr)
              transcript=asr(path,generate_kwargs={"language":"ar","task":"transcribe"})["text"].strip()
              assert len(transcript)>10, f"Unusable {label} transcript"
              refs.append(dict(label=label,path=path,transcript=transcript,start=start,end=end,target=target,generated_seconds=seconds))
          print("ALIGNED_REFERENCES",json.dumps(refs,ensure_ascii=False),flush=True)
          del asr; gc.collect()
          from f5_tts.infer.utils_infer import load_model, load_vocoder
          from f5_tts.model import DiT
          from habibi_tts.infer.utils_infer import infer_process
          repo="Jip7e/habibi-tts-doda-darija"
          ckpt=hf_hub_download(repo, "model_ema.safetensors")
          vocab=hf_hub_download(repo, "vocab.txt")
          cfg=dict(dim=1024,depth=22,heads=16,ff_mult=2,text_dim=512,conv_layers=4)
          model=load_model(DiT,cfg,ckpt,vocab_file=vocab,device="cpu")
          vocoder=load_vocoder("vocos",device="cpu")
          import numpy as np
          started=time.time()
          outputs=[]
          for ref in refs:
              torch.manual_seed(20260930)
              with torch.inference_mode():
                  wav,rate,_=infer_process(ref["path"],ref["transcript"],ref["target"],model,vocoder,nfe_step=32,cfg_strength=2.0,sway_sampling_coef=-1.0,speed=1.0,fix_duration=ref["end"]-ref["start"]+ref["generated_seconds"],device="cpu")
              assert len(wav)>rate, "Output too short"
              sf.write(OUT/f'mustapha_{ref["label"]}.wav',wav,rate)
              outputs.append(wav)
          wav=np.concatenate([outputs[0],np.zeros(int(rate*0.30)),outputs[1]])
          sf.write(OUT/"mustapha_hadra_prosody_v1.wav",wav,rate)
          meta={"model":repo,"method":"Question and statement conditioned on timestamp-aligned matching segments of existing own recording; no pitch processing","references":refs,"alignment":alignment,"rate":rate,"seconds":len(wav)/rate,"inference_seconds":time.time()-started,"accepted_by_user":False}
          (OUT/"validation.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps(meta,ensure_ascii=False),flush=True)
          PY
          python -u /tmp/validate_voice.py
      - name: Preserve audio and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mustapha-hadra-validation
          path: voice_validation/
          retention-days: 3
          if-no-files-found: warn
