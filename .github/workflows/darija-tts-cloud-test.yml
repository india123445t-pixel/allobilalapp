name: Mustapha Voice Clone Test

on:
  push:
    branches:
      - temp/darija-tts-cloud-test
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COQUI_TOS_AGREED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "TTS==0.22.0" "transformers==4.38.2" "tokenizers==0.15.2"

      - name: Download and normalize Mustapha reference
        run: |
          curl -L --fail --retry 3 "https://resource2.heygen.ai/audio/7fa5e8f14fd9486c98bab83932f35bca/original.wav" -o mustapha_ref_raw.wav
          ffmpeg -y -i mustapha_ref_raw.wav -ac 1 -ar 22050 -t 30 mustapha_ref.wav
          ls -lh mustapha_ref.wav

      - name: Generate cloned Darija audio
        run: python .github/scripts/generate_darija.py

      - name: Upload cloned WAV
        uses: actions/upload-artifact@v4
        with:
          name: mustapha-clone-test
          path: mustapha_clone_test.wav
          if-no-files-found: error
