name: Mustapha Moroccan Voice Pipeline

on:
  push:
    branches:
      - temp/darija-tts-cloud-test
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.1.2" "torchaudio==2.1.2"
          pip install "transformers==4.49.0" accelerate scipy soundfile sentencepiece
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git
          pip install "numpy==1.23.5" "librosa==0.9.1" "inflect==7.0.0" "unidecode==1.3.7" "eng_to_ipa==0.0.2" "pypinyin==0.50.0" "jieba==0.42.1" "cn2an==0.5.22"
          pip install -e ./OpenVoice --no-deps
          python - <<'PY'
from huggingface_hub import hf_hub_download
for name in ["checkpoints/converter/config.json","checkpoints/converter/checkpoint.pth"]:
    p=hf_hub_download(repo_id="myshell-ai/OpenVoice", filename=name, local_dir="OpenVoice")
    print("OPENVOICE_FILE="+p)
PY

      - name: Download and normalize Mustapha reference
        run: |
          curl -L --fail --retry 3 "https://resource2.heygen.ai/audio/7fa5e8f14fd9486c98bab83932f35bca/original.wav" -o mustapha_ref_raw.wav
          ffmpeg -y -i mustapha_ref_raw.wav -ac 1 -ar 22050 -t 30 mustapha_ref.wav
          ls -lh mustapha_ref.wav

      - name: Generate Moroccan pronunciation and transfer Mustapha voice
        run: python .github/scripts/generate_darija.py

      - name: Upload comparison WAVs
        uses: actions/upload-artifact@v4
        with:
          name: mustapha-moroccan-voice-test
          path: |
            darija_base.wav
            mustapha_darija_clone.wav
          if-no-files-found: error
