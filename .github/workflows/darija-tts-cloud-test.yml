name: Darija TTS Cloud Test

on:
  push:
    branches:
      - temp/darija-tts-cloud-test
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install "outetts==0.3.3" huggingface_hub
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Generate Darija audio
        run: python .github/scripts/generate_darija.py

      - name: Upload WAV
        uses: actions/upload-artifact@v4
        with:
          name: darija-audio
          path: darija.wav
          if-no-files-found: error
